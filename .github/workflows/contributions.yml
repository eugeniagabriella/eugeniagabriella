name: Update Contribution Graph

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contributions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate contribution graph
        uses: shinpr/github-profile-stats@v0.2.0
        id: stats
        with:
          username: ${{ github.repository_owner }}
          token: ${{ github.token }}
          profile: activity-consistency

      - name: Copy generated SVGs
        env:
          READY_DIR: ${{ steps.stats.outputs.ready-dir }}
        run: |
          mkdir -p profile
          cp "$READY_DIR"/activity-consistency-*.svg profile/

          test -s profile/activity-consistency-wide-dark.svg
          test -s profile/activity-consistency-wide-light.svg
          test -s profile/activity-consistency-compact-dark.svg
          test -s profile/activity-consistency-compact-light.svg

      - name: Commit contribution graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/activity-consistency-*.svg
          git commit -m "Update contribution graph" || exit 0
          git push
