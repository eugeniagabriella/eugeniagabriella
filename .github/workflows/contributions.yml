name: Update Contribution Graph

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contributions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate contribution graph
        uses: shinpr/github-profile-stats@v0.2.0
        with:
          username: ${{ github.repository_owner }}

      - name: Move contribution graph
        run: |
          mkdir -p profile
          cp signal-field-wide-dark.svg profile/contributions.svg

      - name: Commit contribution graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/contributions.svg
          git commit -m "Update contribution graph" || exit 0
          git push
