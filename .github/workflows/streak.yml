name: Update GitHub Streak

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  streak:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate GitHub streak
        uses: zients/github-readme-streak-stats@v2
        with:
          options: >-
            user=${{ github.repository_owner }}
            &theme=dark
            &disable_animations=true
            &hide_border=true
            &card_width=360
            &card_height=195
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated streak
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update GitHub streak"
          git push
